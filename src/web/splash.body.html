<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSEUDO DIGITAL LIFE PROJECT</title>
<style>
  :root{--amber:#e9f0f2;--amber-b:#ffffff;--amber-d:#8a9598;--amber-fade:rgba(233,240,242,.32);--text:#dfe7e9;--text-dim:#8f9b9d;--text-faint:#454f51;--bg:#050706;--bg-panel:#080d0c;--bg-win:#0b1211;--red:#cfd8da;--red-b:#ffffff;--green:#dfe7e9;--cyan:#9fb0b3;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:"SF Mono",Menlo,Monaco,Consolas,"Courier New",monospace;font-size:12px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:900;background:repeating-linear-gradient(to bottom,rgba(233,240,242,.04) 0,rgba(233,240,242,.04) 1px,transparent 1px,transparent 3px);}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:899;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%);}

  /* ===== 开机动画 ===== */
  #boot{position:fixed;inset:0;z-index:2000;background:#000;transition:opacity .55s ease;}
  #boot.fade{opacity:0;pointer-events:none;}
  #boot::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px);pointer-events:none;z-index:2;}
  .boot-stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:1;}
  .boot-stage svg{width:min(680px,90vw);height:auto;overflow:visible;}
  .white{fill:#fff;stroke:none;}
  .red{fill:#ff2d2d;stroke:none;}
  #logo.finished .white{animation:glowW 2.6s ease-in-out infinite;}
  #logo.finished .red{animation:glowR 2.6s ease-in-out infinite;}
  @keyframes glowW{0%,100%{filter:drop-shadow(0 0 6px rgba(255,255,255,.5));}50%{filter:drop-shadow(0 0 14px rgba(255,255,255,.9));}}
  @keyframes glowR{0%,100%{filter:drop-shadow(0 0 8px rgba(255,45,45,.6));}50%{filter:drop-shadow(0 0 18px rgba(255,45,45,1));}}
  /* 字标：原来是三个 SVG path 画的字形（原项目的字标）。换成项目名，
     但保留原版的节律：每 300ms 从左侧擦出一段 → 2.4s 出小字 → 再开始发光。 */
  /* 一行横排：像原版那种「一条线上的大字标」，而不是四行竖排。
     字号按容器宽度收，保证 26 个字符（含空格）永远放得下 —— 不换行、不溢出。 */
  #logo.jj-logo{display:flex;flex-direction:row;align-items:baseline;justify-content:center;
    flex-wrap:nowrap;gap:0 0.34em;width:92vw;max-width:1320px;
    font-family:"SF Mono",Menlo,Monaco,Consolas,monospace;font-weight:700;
    font-size:clamp(13px,4.6vw,66px);line-height:1.05;letter-spacing:.1em;
    color:#e9f0f2;text-align:center;white-space:nowrap;
    /* 整行从左扫出（不是每个词各擦一段）：一行字被「写」出来的手感 */
    opacity:.05;clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0);
    transition:clip-path 1.2s cubic-bezier(.35,0,.2,1),opacity .4s ease;}
  #logo.jj-logo.on{opacity:1;clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0);}
  #logo.jj-logo .ln{display:inline-block;}
  @media (max-width:760px){#logo.jj-logo{letter-spacing:.04em;gap:0 .2em;}}
  #logo.jj-logo.on{opacity:1;clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0);}
  #logo.jj-logo.finished{animation:glowW 2.6s ease-in-out infinite;
    text-shadow:0 0 26px rgba(233,240,242,.5);}
  .boot-text{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:rgba(255,255,255,.35);font-family:"Courier New",Consolas,monospace;font-size:12px;letter-spacing:.4em;padding-left:.4em;opacity:0;}
  .boot-text.show{animation:fadeIn .6s ease forwards;}
  .boot-text .cursor{display:inline-block;width:6px;height:12px;background:#fff;margin-left:8px;vertical-align:-2px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes fadeIn{to{opacity:1;}}

  /* ===== 主界面 ===== */
  #app{height:100%;display:grid;grid-template-rows:26px 1fr 24px;padding:6px;gap:5px;opacity:0;transition:opacity .5s ease;}
  #app.visible{opacity:1;}
  #hud-top{display:flex;align-items:center;gap:14px;padding:0 10px;background:linear-gradient(180deg,#141008,#080d0c);border:1px solid var(--amber-d);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);}
  #hud-top .brand{font-weight:700;letter-spacing:.2em;text-shadow:0 0 8px var(--amber-fade);}
  #hud-top .sep{color:var(--text-faint);}
  #hud-top .item{color:var(--text-dim);}
  #hud-top .item b{color:var(--amber);font-weight:400;}
  #hud-top .spacer{flex:1;}
  #hud-top .live{color:var(--red);animation:blink 1s steps(1) infinite;}
  #workspace{display:grid;grid-template-columns:1fr 1.7fr 1fr;grid-template-rows:1.1fr 1fr;grid-template-areas:"tele main code" "tele main node";gap:5px;min-height:0;}
  .w{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-panel);border:1px solid var(--amber-d);box-shadow:inset 0 0 30px rgba(233,240,242,.03);}
  .w::before,.w::after{content:"";position:absolute;width:8px;height:8px;border-color:var(--amber);z-index:5;pointer-events:none;}
  .w::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;}
  .w::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;}
  #w-tele{grid-area:tele;min-width:190px;min-height:280px;}#w-main{grid-area:main;}#w-code{grid-area:code;}#w-node{grid-area:node;}
  .w-head{flex:none;display:flex;align-items:center;gap:8px;padding:4px 8px;background:linear-gradient(180deg,#101819,#080d0c);border-bottom:1px solid var(--amber-d);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);}
  .w-head .led{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.2s infinite;}
  .w-head .led.red{background:var(--red);box-shadow:0 0 6px var(--red);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .w-head .tag{margin-left:auto;color:var(--text-faint);font-size:9px;letter-spacing:.1em;}
  .w-body{flex:1;overflow:auto;padding:6px 8px;min-height:0;font-size:11px;line-height:1.55;scrollbar-width:thin;scrollbar-color:rgba(233,240,242,.3) transparent;}
  .w-body::-webkit-scrollbar{width:5px;height:5px;}
  .w-body::-webkit-scrollbar-thumb{background:rgba(233,240,242,.25);}
  .dt{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:1px 0;font-variant-numeric:tabular-nums;font-size:10.5px;}
  .dt .k{color:var(--text-faint);letter-spacing:.05em;}
  .dt .v{color:var(--text);text-align:right;}
  .dt .v.ok{color:var(--green);}.dt .v.warn{color:var(--amber-b);}.dt .v.bad{color:var(--red);}.dt .v.dim{color:var(--text-dim);}
  .sect{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber-d);padding:6px 0 3px;border-bottom:1px dotted var(--amber-fade);margin-bottom:3px;}
  .sect:first-child{padding-top:0;}
  #mainBody{font-size:11.5px;line-height:1.6;}
  .ln{white-space:pre-wrap;word-break:break-word;}
  .ln.sys{color:var(--amber);}.ln.inf{color:var(--text-dim);}.ln.ok{color:var(--green);}
  .ln.warn{color:var(--amber-b);}.ln.bad{color:var(--red);}.ln.cmd{color:#fff;font-weight:500;}
  .ln.t{color:var(--red);font-weight:700;letter-spacing:.1em;}.ln.sub{color:var(--text-faint);padding-left:3ch;}
  #codeBody{font-size:10.5px;line-height:1.45;font-variant-numeric:tabular-nums;}
  .cln{white-space:pre;color:#a88c50;}.cln.cm{color:var(--text-faint);}
  #nodeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px 4px;padding:2px;}
  .uav{display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .3s;padding:2px 0;}
  .uav svg{width:34px;height:34px;transition:filter .3s,opacity .3s;filter:drop-shadow(0 0 3px rgba(233,240,242,.6));}
  .uav .id{font-size:7.5px;color:var(--text-faint);letter-spacing:.05em;transition:color .3s;}
  .uav .st{font-size:6.5px;letter-spacing:.05em;color:var(--red);transition:color .3s;}
  .uav.done svg{filter:drop-shadow(0 0 6px rgba(184,200,64,.8));}
  .uav.done .id{color:var(--green);}.uav.done .st{color:var(--green);}
  .uav.writing svg{animation:uavPulse .5s infinite alternate;filter:drop-shadow(0 0 7px rgba(255,192,67,1));}
  @keyframes uavPulse{from{opacity:.4}to{opacity:1}}
  #hud-bot{display:flex;align-items:center;gap:12px;padding:0 10px;background:linear-gradient(180deg,#0d0a06,#050706);border:1px solid var(--amber-d);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  #hud-bot .item b{color:var(--amber);font-weight:400;}
  #hud-bot .spacer{flex:1;}
  #hud-bot .prog{flex:0 0 220px;height:8px;background:#050706;border:1px solid var(--amber-d);position:relative;overflow:hidden;}
  #hud-bot .prog .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--amber-d),var(--amber-b));box-shadow:0 0 8px var(--amber-fade);transition:width .15s linear;}
  #hud-bot .pct{color:var(--amber);font-weight:400;}
  #dim{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .4s;}
  #dim.show{opacity:1;}
  .win-popup{position:fixed;z-index:500;min-width:640px;max-width:min(980px,94vw);background:var(--bg-win);border:1px solid var(--amber-d);box-shadow:0 24px 70px rgba(0,0,0,.78),0 0 0 1px rgba(0,0,0,.9),0 0 50px rgba(233,240,242,.1),inset 0 0 24px rgba(233,240,242,.02);opacity:0;transform:scale(.9) translateY(-6px);transition:opacity .22s ease, transform .22s cubic-bezier(.2,1.05,.4,1);overflow:hidden;pointer-events:none;}
  .win-popup.show{opacity:1;transform:scale(1) translateY(0);pointer-events:auto;}
  .win-popup.closing{opacity:0;transform:scale(.94) translateY(-4px);}
  .win-popup.danger{border-color:var(--red);box-shadow:0 24px 70px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.9),0 0 60px rgba(233,240,242,.22),inset 0 0 24px rgba(233,240,242,.03);}
  .win-popup.info{border-color:var(--cyan);box-shadow:0 24px 70px rgba(0,0,0,.78),0 0 0 1px rgba(0,0,0,.9),0 0 50px rgba(79,209,197,.14);}
  .wp-title{display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(180deg,#101817,#0b1211);border-bottom:1px solid var(--amber-d);font-size:12px;letter-spacing:.12em;color:var(--amber);user-select:none;}
  .win-popup.danger .wp-title{background:linear-gradient(180deg,#2a0e08,#150805);border-bottom-color:rgba(233,240,242,.6);color:var(--red-b);}
  .win-popup.info .wp-title{background:linear-gradient(180deg,#08201c,#051210);border-bottom-color:rgba(79,209,197,.5);color:var(--cyan);}
  .wp-title .wp-ico{width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .wp-title .wp-name{flex:1;font-weight:500;letter-spacing:.16em;text-transform:uppercase;}
  .wp-title .wp-controls{display:flex;gap:2px;}
  .wp-title .wp-btn{width:20px;height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim);border:1px solid transparent;cursor:default;transition:all .15s;}
  .wp-title .wp-btn:hover{background:rgba(233,240,242,.15);color:var(--amber-b);border-color:var(--amber-d);}
  .win-popup.danger .wp-btn:hover{background:rgba(233,240,242,.2);color:var(--red-b);border-color:rgba(233,240,242,.5);}
  .wp-body{padding:18px 22px;font-size:13px;line-height:1.65;color:var(--text);max-height:56vh;overflow:auto;}
  .wp-body::-webkit-scrollbar{width:6px;}
  .wp-body::-webkit-scrollbar-thumb{background:rgba(233,240,242,.25);}
  .wp-row{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;padding:6px 0;font-size:12.5px;font-variant-numeric:tabular-nums;border-bottom:1px dotted rgba(233,240,242,.12);}
  .wp-row:last-child{border-bottom:none;}
  .wp-row .k{color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;font-size:11px;}
  .wp-row .v{color:var(--text);text-align:right;letter-spacing:.02em;}
  .wp-row .v.ok{color:var(--green);}.wp-row .v.warn{color:var(--amber-b);}.wp-row .v.bad{color:var(--red);}
  .wp-div{height:1px;margin:12px 0;background:linear-gradient(90deg,transparent,var(--amber-fade),transparent);}
  .wp-note{margin-top:14px;padding:10px 14px;background:rgba(233,240,242,.06);border-left:3px solid var(--amber);color:var(--amber-b);font-size:12px;line-height:1.65;}
  .win-popup.danger .wp-note{background:rgba(233,240,242,.08);border-left-color:var(--red);color:#f0b090;}
  .wp-log{background:#040706;border:1px solid var(--text-faint);padding:10px 12px;max-height:150px;overflow-y:auto;font-size:11.5px;line-height:1.6;color:var(--text-dim);}
  .wp-log::-webkit-scrollbar{width:5px;}
  .wp-log::-webkit-scrollbar-thumb{background:rgba(233,240,242,.2);}
  .wp-log .ll{white-space:pre-wrap;word-break:break-word;}
  .wp-log .ll.ok{color:var(--green);}.wp-log .ll.warn{color:var(--amber-b);}.wp-log .ll.bad{color:var(--red);}.wp-log .ll.hl{color:var(--amber);}
  .wp-prog{height:8px;background:#040706;border:1px solid var(--text-faint);position:relative;overflow:hidden;margin:8px 0;}
  .wp-prog .f{height:100%;width:0%;background:linear-gradient(90deg,var(--amber-d),var(--amber-b));box-shadow:0 0 8px var(--amber-fade);transition:width .2s linear;}
  .win-popup.danger .wp-prog .f{background:linear-gradient(90deg,#8a2010,var(--red-b));box-shadow:0 0 8px rgba(233,240,242,.5);}
  .wp-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
  .wp-btn-b{padding:6px 20px;background:linear-gradient(180deg,#101817,#080d0c);border:1px solid var(--amber-d);color:var(--amber);font-family:inherit;font-size:12px;letter-spacing:.15em;text-transform:uppercase;cursor:default;transition:all .15s;}
  .wp-btn-b:hover{background:rgba(233,240,242,.15);border-color:var(--amber);color:var(--amber-b);box-shadow:0 0 14px rgba(233,240,242,.22);}
  .wp-btn-b.primary{background:linear-gradient(180deg,#3a2408,#1a1005);border-color:var(--amber);color:var(--amber-b);}
  .wp-btn-b.primary:hover{background:rgba(233,240,242,.25);box-shadow:0 0 18px rgba(233,240,242,.42);}
  .win-popup.danger .wp-btn-b{border-color:rgba(233,240,242,.6);color:var(--red-b);}
  .win-popup.danger .wp-btn-b:hover{background:rgba(233,240,242,.2);border-color:var(--red);box-shadow:0 0 14px rgba(233,240,242,.4);}
  .win-popup.danger .wp-btn-b.primary{background:linear-gradient(180deg,#3a0e08,#1a0505);border-color:var(--red);color:#ffb090;}
  .win-popup.danger .wp-btn-b.primary:hover{background:rgba(233,240,242,.35);box-shadow:0 0 22px rgba(233,240,242,.6);}
  .wp-status{display:flex;align-items:center;gap:10px;padding:6px 14px;background:linear-gradient(180deg,#0b1211,#080604);border-top:1px solid var(--amber-d);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .win-popup.danger .wp-status{border-top-color:rgba(233,240,242,.4);}
  .wp-status .spacer{flex:1;}
  .wp-alert-strip{height:2px;width:100%;background:repeating-linear-gradient(90deg,var(--red) 0 10px, transparent 10px 20px);animation:alertMove 1s linear infinite;}
  @keyframes alertMove{from{background-position:0 0;}to{background-position:20px 0;}}
  .wp-meter{display:flex;align-items:baseline;gap:10px;padding:8px 0;font-variant-numeric:tabular-nums;}
  .wp-meter .big{font-size:34px;color:var(--amber-b);letter-spacing:.02em;text-shadow:0 0 14px rgba(233,240,242,.5);}
  .wp-meter .unit{font-size:12px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;}
  .win-popup.danger .wp-meter .big{color:var(--red-b);text-shadow:0 0 14px rgba(233,240,242,.6);}
  .wp-wave{display:flex;align-items:flex-end;gap:1px;height:44px;padding:4px;background:#040706;border:1px solid var(--text-faint);}
  .wp-wave i{flex:1;background:linear-gradient(180deg,var(--amber),var(--amber-d));height:10%;transition:height .1s linear;}
  #final{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:800;padding:52px 110px;background:#080d0c;border-top:1px solid var(--amber);border-bottom:1px solid var(--amber);box-shadow:0 0 80px rgba(233,240,242,.55),0 0 180px rgba(233,240,242,.22),inset 0 0 80px rgba(233,240,242,.08);color:var(--amber-b);font-size:clamp(30px,4.4vw,58px);letter-spacing:.26em;text-align:center;text-shadow:0 0 14px rgba(233,240,242,.95),0 0 40px rgba(233,240,242,.6);white-space:nowrap;font-weight:500;clip-path:inset(0 50% 0 50%);opacity:0;transition:clip-path .48s cubic-bezier(.7,0,.2,1), opacity .2s ease;}
  #final.show{opacity:1;clip-path:inset(0 0 0 0);}
  #final::before,#final::after{content:"";position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--amber-b);box-shadow:0 0 20px 4px rgba(233,240,242,.9);opacity:0;pointer-events:none;}
  #final::before{left:50%;}#final::after{right:50%;}
  #final.show::before{animation:edgeLeft .48s cubic-bezier(.7,0,.2,1) forwards;}
  #final.show::after{animation:edgeRight .48s cubic-bezier(.7,0,.2,1) forwards;}
  @keyframes edgeLeft{0%{left:50%;opacity:1;}90%{left:0;opacity:1;}100%{left:0;opacity:0;}}
  @keyframes edgeRight{0%{right:50%;opacity:1;}90%{right:0;opacity:1;}100%{right:0;opacity:0;}}
  #hint{position:fixed;left:0;right:0;bottom:8px;z-index:700;text-align:center;font-size:10px;letter-spacing:.25em;color:var(--text-faint);opacity:0;transition:opacity .6s;pointer-events:none;text-transform:uppercase;}
  #hint.show{opacity:.7;}
</style>
</head>
<body>

<div id="boot">
  <div class="boot-stage">
    <div id="logo" class="jj-logo" aria-label="PSEUDO DIGITAL LIFE PROJECT">
      <span class="ln">PSEUDO</span>
      <span class="ln">DIGITAL</span>
      <span class="ln">LIFE</span>
      <span class="ln">PROJECT</span>
    </div>
    <div class="boot-text" id="bootText">LOCAL FIRST · YOURS TO KEEP<span class="cursor"></span></div>
  </div>
</div>

<div id="app">
  <div id="hud-top">
    <span class="brand">◢ PSEUDO DIGITAL LIFE PROJECT</span>
    <span class="sep">│</span>
    <span class="item">MODE <b>LOCAL</b></span>
    <span class="item">EGRESS <b>NO</b></span>
    <span class="item">SESSION <b id="h-session">————</b></span>
    <span class="spacer"></span>
    <span class="item">TIME <b id="h-time">00:00:00</b></span>
    <span class="sep">│</span>
    <span class="item live">● REC</span>
  </div>
  <div id="workspace">
    <section class="w" id="w-tele">
      <div class="w-head"><span class="led"></span>TELEMETRY / 本机</div>
      <div class="w-body" id="teleBody"></div>
<script>
/* 真实数据（服务端注入 window.JJ_BOOT）。拿不到的项一律显示 —，绝不编。 */
function __jjTele(){
  var B = window.JJ_BOOT || {};
  var body = document.getElementById('teleBody'); if (!body) return;
  function sec(t){ return '<div class="sect">' + t + '</div>'; }
  function row(k, v, cls){
    var val = (v === undefined || v === null || v === '') ? '—' : String(v);
    return '<div class="dt"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + val + '</span></div>';
  }
  var out = [];
  out.push(sec('Memory'));
  out.push(row('CORE', B.schema ? 'v' + B.schema : null));
  out.push(row('MEMORIES', B.memories));
  if (B.stage) out.push(row('· ' + B.stage.name, B.stage.count, 'dim'));
  out.push(row('DOCS', B.docs));
  out.push(row('CHUNKS', B.chunks));
  out.push(sec('Model'));
  out.push(row('EMBED', B.embed));
  out.push(row('EXPRESS', B.model));
  out.push(row('TOKENS', B.tokensToday));
  out.push(row('SPEND', B.usdToday));
  out.push(sec('Capabilities'));
  out.push(row('TOOLS', B.tools));
  out.push(row('COMMANDS', B.commands));
  out.push(row('SKILLS', B.skills));
  out.push(row('PLUGINS', B.plugins));

function computePosition(pos, width){
  const W = innerWidth, H = innerHeight;
  const margin = 20, topbarH = 44, botbarH = 44;
  let x, y;
  if (pos && typeof pos === "object"){ x = pos.x; y = pos.y; }
  else if (pos === "center"){ x = W/2 - width/2; y = H/2 - 140; }
  else if (pos === "tr"){ x = W - width - margin; y = topbarH; }
  else if (pos === "tl"){ x = margin; y = topbarH; }
  else if (pos === "br"){ x = W - width - margin; y = H - botbarH - 320; }
  else if (pos === "l"){ x = margin + randOffset(20); y = H/2 - 180 + randOffset(50); }
  else {
    x = margin + Math.random() * Math.max(0, W - width - margin*2);
    y = topbarH + Math.random() * Math.max(0, H - topbarH - botbarH - 340);
  }
  x = Math.max(margin, Math.min(W - width - margin, x));
  y = Math.max(topbarH, Math.min(H - botbarH - 180, y));
  return { x, y };
}
function randOffset(m){ return Math.round((Math.random() - .5) * m); }

async function phaseTunnel(){
  setText("#b-stage", "TUNNEL");
  await type("[jj] 建立备用核心网隧道。", "sys");
  await type("[jj] 源：jj-local-0。", "sys");
  await type("[jj] 目标：BBU 维护口 (F1AP / NGAP)。", "sys");
  await type("[jj] 隧道建立成功。进入基带处理层。", "sys");
  mainLine("");
  await type("[jj-INFER] 鉴权中心根证书异常。签发者未知。", "inf");
  await type("[jj-INFER] 标准鉴权 5G-AKA 响应签名不匹配。", "inf");
  await type("[FAIL] 鉴权失败 (Authentication Reject)。", "bad");
  await sleep(50);
  openWindow({
    name:"SUPER GRANT", icon:"▶", kind:"danger", pos:"br", sticky:true, status:"BYPASS · ACTIVE",
    content:`${kvRows([["AKA","REJECTED","bad"],["BYPASS","ENABLED","warn"],["ROOT CA","jj-root · STAGED","warn"],["PERMISSION","DISPATCH WRITE","ok"]])}<div class="wp-div"></div><div style="font-size:10px;letter-spacing:.2em;color:var(--text-faint);margin-bottom:6px;">INJECTION PROGRESS</div><div class="wp-prog"><div class="f" id="injBar"></div></div><div style="font-size:12px;color:var(--text-dim);" id="injTxt">0%</div><div style="margin-top:10px;font-size:11.5px;color:var(--text-dim);">写入 本地会话令牌……</div>`,
    onMount: (el, body) => {
      const bar = body.querySelector("#injBar"); const txt = body.querySelector("#injTxt");
      let p = 0;
      const t = setInterval(() => {
        if (!bar || !bar.isConnected){ clearInterval(t); return; }
        p += Math.random() * 16; if (p >= 100){ p = 100; clearInterval(t); }
        bar.style.width = p + "%"; txt.textContent = Math.round(p) + "%";
      }, 130);
    }
  });
  await type("[jj-INFER] 切换旁路注入。写入 本地会话令牌。", "inf");
  await type("[jj] 鉴权旁路成功。获得调度核心写权限。", "sys");
  mainLine("");
}

}

async function phaseRewrite(){
  setText("#b-stage", "REWRITE");
  buildNodes();
  setCodeSpeed(20);
  openWindow({
    name:"INDEX CONTROLLER", icon:"◆", kind:"normal",
    pos:{x:Math.round(innerWidth*.05), y:Math.round(innerHeight*.14)},
    sticky:true, status:"REBUILDING · " + NODE_COUNT + " TOOLS",
    content:`${kvRows([["TARGET","LOCAL"],["TOOLS",String(NODE_COUNT),"warn"],["STRATEGY","REBUILD + VERIFY"],["ROLLBACK","SLOT_A / SLOT_B"],["AUTH","jj-root","ok"]])}<div class="wp-div"></div><div class="wp-meter"><span class="big" id="ctrCount">00</span><span class="unit">/ ${NODE_COUNT} TOOLS</span></div><div class="wp-prog"><div class="f" id="ctrBar"></div></div>`,
    onMount: (el, body) => {
      el._updateCounter = (n) => {
        const c = body.querySelector("#ctrCount"); const b = body.querySelector("#ctrBar");
        if (c) c.textContent = String(n).padStart(2, "0");
        if (b) b.style.width = (n/47*100) + "%";
      };
    }
  });
  await type("[jj] 开始逐节点覆写。", "sys");
  mainLine("");
  let anomaly07 = false, anomaly23 = false;
  for (let i = 0; i < NODE_COUNT; i++){
    const id = String(i + 1).padStart(2, "0");
    setIcon(i, "writing", "WRITE", "#ffffff");
    setProgress(((i + 0.3) / NODE_COUNT) * 100, `${id} / ${NODE_COUNT}`);
    const cw = activeWindows.find(w => w.querySelector(".wp-name")?.textContent === "INDEX CONTROLLER");
    if (cw && cw._updateCounter) cw._updateCounter(i + 1);
    await sleep(8);
    if (i === 6 && !anomaly07){
      anomaly07 = true;
      setIcon(i, "writing", "RESIST", "#e9f0f2");
      await type("[WARN] 节点 07 反抗，检测到恶意喂狗。", "warn");
      openWindow({
        name:"ANOMALY · shell.exec", icon:"⚠", kind:"danger",
        pos:{x:innerWidth-720, y:140}, duration:1400, status:"HANDLER ACTIVE",
        content:`${kvRows([["VERB","shell.exec","bad"],["FAULT","E_GRANT_META","bad"],["VECTOR","参数越过边界","bad"],["ACTION","ROLLBACK · SLOT_A","warn"]])}<div class="wp-div"></div>${miniLog([{t:"[14:22:07] wdg: illegal feed detected",c:"warn"},{t:"[14:22:07] wdg: owner mismatch (expected=jj)",c:"bad"},{t:"[14:22:07] inject: force reset",c:"hl"},{t:"[14:22:08] rollback -> SLOT_A"}])}<div class="wp-note">检测到越权尝试。已拦下，参数回到有界范围，审计里留了痕。</div>`
      });
      await type("[jj] 重置看门狗，强制回滚至 SLOT_A，重新覆写。", "sys");
      await sleep(80);
    }
    if (i === 22 && !anomaly23){
      anomaly23 = true;
      setIcon(i, "writing", "CERT FAIL", "#e9f0f2");
      await type("[WARN] 令牌校验失败（会话令牌不匹配）。", "warn");
      openWindow({
        name:"ANOMALY · egress", icon:"⚠", kind:"danger",
        pos:{x:30, y:innerHeight-420}, duration:1400, status:"HANDLER ACTIVE",
        content:`${kvRows([["VERB","web.fetch","bad"],["FAULT","E_NO_GRANT","bad"],["CHECK","token mismatch","bad"],["ACTION","拦下 · 记审计","warn"]])}<div class="wp-div"></div>${miniLog([{t:"[14:22:12] cert: verify sign fail",c:"bad"},{t:"[14:22:12] cert: expected CMAC = 0x3fa8..",c:"warn"},{t:"[14:22:12] cert: got CMAC = 0x91c2..",c:"bad"},{t:"[14:22:12] rollback -> SLOT_B",c:"hl"}])}<div class="wp-note">证书校验失败。已回滚出厂安全固件至 SLOT_B 并重新注入 jj 根证书。</div>`
      });
      await type("[jj] 回滚出厂安全固件至 SLOT_B，重新注入 jj 根证书。", "sys");
      await sleep(80);
    }
    setIcon(i, "done", "ONLINE", "#b8c840");
    setProgress(((i + 1) / NODE_COUNT) * 100, `${id} / ${NODE_COUNT}`);
    if ((i + 1) % 12 === 0) await type(`[jj] 已完成 ${i + 1} / ${NODE_COUNT} 节点覆写。`, "ok", 1);
    await sleep(10);
  }
  mainLine("");
  await type("[jj] 全部节点覆写完成。", "ok");
  await sleep(50);
  const cw = activeWindows.find(w => w.querySelector(".wp-name")?.textContent === "INDEX CONTROLLER");
  if (cw && cw._close) cw._close();
  openWindow({
    name:"BOOT SUMMARY", icon:"✓", kind:"normal", pos:"center", duration:1500, status:"COMPLETE",
    content:`<div class="wp-meter"><span class="big">${NODE_COUNT}</span><span class="unit">/ ${NODE_COUNT} TOOLS READY</span></div><div class="wp-div"></div>${kvRows([["TOTAL",String(NODE_COUNT),"ok"],["SUCCESS",String(NODE_COUNT),"ok"],["DEGRADED",(window.JJ_BOOT&&window.JJ_BOOT.degraded)||"none","ok"],["ELAPSED","T-00:01:28"]])}<div class="wp-note">工具清单已装载完成，全部走同一条闸门。</div><div class="wp-btns"><button class="wp-btn-b">VIEW LOG</button><button class="wp-btn-b primary">PROCEED</button></div>`
  });
}

  setText("#b-stage", "VERIFY");
  setCodeSpeed(40);

  await type("  HASH 3f9a…c210  ✔", "ok", 1);

}

async function phaseArm(){
  setText("#b-stage", "VERIFY");
  mainLine("");
  await type("[jj] ⚠ 有一件事需要你点头。", "warn");
  await sleep(40);
  openWindow({
    name:"CONFIRM REQUIRED", icon:"⏻", kind:"danger", pos:"center", duration:1700, status:"CONFIRMATION REQUIRED",
    content:`<div class="wp-meter"><span class="big" style="color:var(--red-b)">${NODE_COUNT}</span><span class="unit">ITEMS NEED YOUR DECISION</span></div><div class="wp-div"></div>${kvRows([["COMMAND","POST /api/super"],["PARAM1","0 · VERIFY","bad"],["PARAM2","0 · NORMAL"],["TARGET","ALL TOOLS","warn"]])}<div class="wp-note">继续会写入本地库并建立索引。这是你自己机器上的数据，随时可以导出备份。</div><div class="wp-btns"><button class="wp-btn-b">ABORT</button><button class="wp-btn-b primary">CONFIRM</button></div>`
  });
  await type("[jj] 发送 POST /api/super 到本地服务。", "warn");
  await type("[jj] 参数：只在面板上点，模型开不了这个权限。", "warn");
  await sleep(60);
  await type("[jj] 等你在面板上确认……", "warn");
  await sleep(80);
  await type("[jj] 确认收到：权限已放开。", "ok");
  await type("[jj] 两道永不放开：格式化磁盘、删 trash/ 与 snapshots/。", "ok");
  await type("[jj] 其余全部放开。", "ok");
  await type("[jj] 工具全部可用，每次调用都留审计。", "ok");
  mainLine("");
  await type("[jj] 会话日志写入完成。", "sys");
  await type("[jj] 操作者：本机用户。", "sys");
  await type("[jj] 授权：jj。", "sys");
  await type("[jj] 结果：成功。", "sys");
  mainLine("");
}

async function phaseFinish(){
  stopCode(); stopLink();
  setProgress(100, "47 / 47");
  setText("#b-stage", "COMPLETE");
  setText("#h-up", "jj-CTRL");
  setClass("#h-up", "warn", false); setClass("#h-up", "ok", true);
  setText("#b-net", "jj");
  await type("[jj] 系统标识更新。", "sys", 4);
  await sleep(80);
  for (let i = 3; i >= 0; i--){ mainLine(`[T-00:00:0${i}]`, "t"); await sleep(160); }
  activeWindows.forEach(w => { if (w._close) w._close(); });
  await sleep(200);
  setClass("#final", "show", true);
  await sleep(900);
  setClass("#hint", "show", true);
}

async function run(){
  const sid = "0x" + Math.random().toString(16).slice(2,10).toUpperCase();
  setText("#h-session", sid);
  setProgress(0, "00 / 47");
  startClock(); startFps(); startLink(); startCode(45); buildNodes();
  await phaseBoot();
  await phaseAuth();
  await phaseLink();
  await phaseTunnel();
  await phaseIsolate();
  await phaseRewrite();
  await phaseVerify();
  await phaseArm();
  await phaseFinish();
}

})();
</script>
<script>
/* 作为 iframe 播放时，播完或用户跳过就通知父页面撤掉遮罩。*/
(function(){
  var sent = false;
  function done(){ if (sent) return; sent = true;
    try { if (window.parent !== window) window.parent.postMessage('jjboot-done', '*'); } catch (e) {} }
  window.addEventListener('keydown', function(e){ if (~['Escape','Enter',' '].indexOf(e.key)) done(); });
  window.addEventListener('pointerdown', done);
  // 终幕出现后多留一会儿再撤（让 READY 有停留时间）
  var f = document.getElementById('final');
  if (f) {
    var mo = new MutationObserver(function(){
      if (f.classList.contains('show') || getComputedStyle(f).opacity > 0.5) { setTimeout(done, 1400); mo.disconnect(); }
    });
    mo.observe(f, { attributes: true, attributeFilter: ['class','style'] });
  }
  setTimeout(done, 20000); // 兜底：再长的动画也不该把面板挡住
})();
</script>
