[package]
name = "jingjing-desktop"
version = "0.1.0"
edition = "2021"
description = "鲸鲸 · 桌面壳（只做四件事：拉起 sidecar / 健康探测与回落 / 托盘 / 退出杀进程）"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
